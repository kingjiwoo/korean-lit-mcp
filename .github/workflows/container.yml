name: Container
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.8'
          enable-cache: true
      - run: uv sync --frozen
      - run: docker build -t korean-lit-mcp:ci .
      - name: Start isolated test server
        # Fixture token is public and only used on the runner's loopback address.
        run: >-
          docker run --detach --rm --read-only --tmpfs /tmp --name korean-lit-ci
          -p 127.0.0.1:8000:8080
          -e MCP_AUTH_TOKEN=ci-fixture-token-01234567890123456789012345678901
          -e MCP_ALLOWED_HOSTS=localhost,127.0.0.1 korean-lit-mcp:ci
      - run: curl --fail --retry 20 --retry-connrefused --retry-delay 1 --retry-max-time 30 http://127.0.0.1:8000/health
      - run: uv run pytest tests/test_http_live.py
        env:
          TEST_MCP_URL: http://127.0.0.1:8000/mcp
          TEST_MCP_TOKEN: ci-fixture-token-01234567890123456789012345678901
      - if: failure()
        run: docker logs korean-lit-ci
      - if: always()
        run: |
          if docker container inspect korean-lit-ci >/dev/null 2>&1; then
            docker stop korean-lit-ci
          fi
