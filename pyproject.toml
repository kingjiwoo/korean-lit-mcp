[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "korean-lit-mcp"
version = "0.1.0"
description = "Source-backed Korean literature passages and quotation verification for teachers."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["fastmcp>=2.13", "httpx>=0.28", "pydantic>=2.11"]

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8.4", "pytest-asyncio>=1.2", "ruff>=0.13"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["data/works"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
